# prod profile: Supabase PostgreSQL 연결 (표준 Spring Boot 실행 방식 - 특정 PaaS 종속 설정 없음)
# 배포 환경(AWS EC2 등)에서 DB_URL/DB_USERNAME/DB_PASSWORD 및 아래 API 키를 환경변수로 주입할 것
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

spotscore:
  sgis:
    base-url: https://sgisapi.mods.go.kr/OpenAPI3
    consumer-key: ${SGIS_CONSUMER_KEY}
    consumer-secret: ${SGIS_CONSUMER_SECRET}
    stat-year: ${SGIS_STAT_YEAR:}
  store-zone:
    base-url: https://apis.data.go.kr/B553077/api/open/sdsc2
    service-key: ${STORE_ZONE_SERVICE_KEY}
  kosis:
    base-url: https://kosis.kr/openapi
    api-key: ${KOSIS_API_KEY}
    stat-year: ${KOSIS_STAT_YEAR:}
  cors:
    # 배포된 프론트 도메인으로 반드시 명시 설정할 것 - 비우면 CORS 전체 비활성(WebConfig 참고)
    allowed-origins: ${SPOTSCORE_CORS_ALLOWED_ORIGINS:}
  discovery:
    root-adm-cd: ${SPOTSCORE_DISCOVERY_ROOT_ADM_CD:}
    signgu-sample-pages: ${SPOTSCORE_DISCOVERY_SIGNGU_SAMPLE_PAGES:20}
  groq:
    base-url: https://api.groq.com/openai/v1
    # SGIS/상권정보/KOSIS와 달리 미설정 시 fail-fast(부팅 실패)시키지 않는다 - 챗봇은
    # 핵심 점수 계산 파이프라인과 무관한 선택적 부가 기능이라, 키가 없으면
    # ChatService가 요청 단위로 안내 메시지만 반환하고 나머지 서비스는 정상 동작해야 한다.
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    max-tool-iterations: ${GROQ_MAX_TOOL_ITERATIONS:6}
    max-tokens: ${GROQ_MAX_TOKENS:1500}
    timeout-seconds: ${GROQ_TIMEOUT_SECONDS:30}

logging:
  level:
    com.spotscore: INFO
