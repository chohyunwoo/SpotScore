  <body>
    <div id="root"></div>
    <!--
      SPA라 위 #root는 JS 실행 전까지 비어 있다. JS를 실행하지 않는 크롤러/환경을 위해
      서비스 핵심 내용을 담은 폴백을 둔다(JS가 켜지면 noscript는 렌더링되지 않는다).
    -->
    <noscript>
      <main>
        <h1>SpotScore — 창업 입지 추천 대시보드</h1>
        <p>
          통계청 인구 통계와 소상공인 상권 정보 등 공공데이터를 결합해, 지역 × 업종별

          수요는 충분하면서 그 수요 대비 경쟁이 상대적으로 여유 있는 입지를 근거와 함께
          추천합니다.
        </p>
        <h2>주요 기능</h2>
        <ul>
          <li>업종을 선택하면 지역별 창업 매력도 랭킹과 지도를 함께 확인</li>
          <li>지역 × 업종 상세 점수 분해(인구 규모 · 가구 구조 · 경쟁 여유도 · 연령 적합도)</li>
          <li>관심 지역 즐겨찾기와 여러 후보지 비교</li>
        </ul>
        <p>이 서비스는 JavaScript가 필요합니다. 대시보드를 이용하려면 JavaScript를 켜 주세요.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
